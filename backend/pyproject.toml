[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-dataops"
version = "0.1.0"
description = "Electromagnetic signal data governance and annotation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.2,<2",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
    "numpy>=2.1,<3",
    "h5py>=3.12,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a dedicated PostgreSQL database and runs migrations"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
